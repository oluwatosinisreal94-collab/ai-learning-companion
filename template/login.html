<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AI Learning Companion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111827;
        }

        .register-container {
            width: 100%;
            max-width: 430px;
        }

        /* Shield */

        .shield {
            width: 34px;
            height: 40px;
            margin: 0 auto 8px;
            position: relative;
        }

        .shield::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 4px solid #4f46e5;
            border-radius: 18px 18px 22px 22px;
            clip-path: polygon(
                50% 0%,
                100% 15%,
                100% 55%,
                85% 78%,
                50% 100%,
                15% 78%,
                0% 55%,
                0% 15%
            );
        }

        .heading {
            text-align: center;
        }

        .heading h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .heading p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Form */


     

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            pointer-events: none;
            padding-bottom: 20px;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 40px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #111827;
            font-size: 16px;
            outline: none;
            transition: 0.2s ease;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        input::placeholder {
            color: #64748b;
        }

        /* Button */

        .create-account {
            width: 100%;
            height: 43px;
            border: none;
            border-radius: 7px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1px;
            transition: 0.2s ease;
        }

        .create-account:hover {
            background: #4338ca;
        }

        .create-account:active {
            transform: scale(0.99);
        }

        /* Login */

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 14px;
        }

        .login-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 480px) {
            .name-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .register-container {
                max-width: 100%;
            }

            .heading h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="register-container">

        <div class="shield"></div>

        <div class="heading">
            <h1>Login</h1>

            <p>
                Login to your account to get started with AI Learning Companion
            </p>
        </div>

        <form action="/login" method="POST" > 

            <div class="form-group">
                <label for="email">Email Address</label>

                <div class="input-wrapper">
                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@company.com"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper">
                    <span class="input-icon">♙</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="create-account">
                Login
            </button>

        </form>

        <p class="login-link">
            Don't have an account? Create Account
            <a href="/register">LogOut</a>
        </p>

    </main>

</body>
</html>
